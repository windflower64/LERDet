# YOLO11 RGBT P2-P5 refine + TargetAwareGuide + C2PSA.
# - Add P2 detect head for small objects.
# - Apply lightweight per-modal refinement on P2/P3/P4/P5.
# - Use IR-guided VIS modulation on P2/P3/P4/P5.
# - Add C2PSA after guided P5 before the neck.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

ch: 4

backbone:
  - [-1, 1, Silence, []]

  # visible
  - [0, 1, SilenceChannel, [0, 3]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]

  # infrared
  - [0, 1, SilenceChannel, [3, 4]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]

  # per-modal refine on all scales
  - [4, 1, DualModalRefine, [256]]      # 21 vis_p2_ref
  - [6, 1, DualModalRefine, [512]]      # 22 vis_p3_ref
  - [8, 1, DualModalRefine, [512]]      # 23 vis_p4_ref
  - [10, 1, DualModalRefine, [1024]]    # 24 vis_p5_ref
  - [14, 1, DualModalRefine, [256]]     # 25 ir_p2_ref
  - [16, 1, DualModalRefine, [512]]     # 26 ir_p3_ref
  - [18, 1, DualModalRefine, [512]]     # 27 ir_p4_ref
  - [20, 1, DualModalRefine, [1024]]    # 28 ir_p5_ref

  # multi-scale IR-guided VIS features
  - [[21, 25], 1, TargetAwareGuide, [4, 0.05, 32]]   # 29 p2_guided
  - [[22, 26], 1, TargetAwareGuide, [4, 0.05, 48]]   # 30 p3_guided
  - [[23, 27], 1, TargetAwareGuide, [4, 0.05, 64]]   # 31 p4_guided
  - [24, 1, SPPF, [1024, 5]]                         # 32 vis_p5_sppf
  - [28, 1, SPPF, [1024, 5]]                         # 33 ir_p5_sppf
  - [[32, 33], 1, TargetAwareGuide, [4, 0.05, 64]]   # 34 p5_guided
  - [-1, 2, C2PSA, [1024]]                           # 35 p5_psa

head:
  - [35, 1, nn.Upsample, [None, 2, "nearest"]]     # 36
  - [[-1, 31], 1, Concat, [1]]                       # 37
  - [-1, 2, C3k2, [512, False]]                      # 38 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 39
  - [[-1, 30], 1, Concat, [1]]                       # 40
  - [-1, 2, C3k2, [256, False]]                      # 41 (P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 42
  - [[-1, 29], 1, Concat, [1]]                       # 43
  - [-1, 2, C3k2, [128, False]]                      # 44 (P2)

  - [-1, 1, Conv, [128, 3, 2]]                       # 45
  - [[-1, 41], 1, Concat, [1]]                       # 46
  - [-1, 2, C3k2, [256, False]]                      # 47

  - [-1, 1, Conv, [256, 3, 2]]                       # 48
  - [[-1, 38], 1, Concat, [1]]                       # 49
  - [-1, 2, C3k2, [512, False]]                      # 50

  - [-1, 1, Conv, [512, 3, 2]]                       # 51
  - [[-1, 35], 1, Concat, [1]]                       # 52
  - [-1, 2, C3k2, [1024, True]]                      # 53

  - [[44, 47, 50, 53], 1, Detect, [nc]]



